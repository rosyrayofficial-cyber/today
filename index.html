<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEEEF1">
<meta name="color-scheme" content="only light">
<title>Today</title>
<meta name="description" content="A tiny Apple-style to-do list that makes finishing tasks feel great.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Today">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29); --accent:#1D1D1F; --accent2:#515154; --title:linear-gradient(180deg,#1D1D1F 30%,#6E6E73); --chrome:linear-gradient(100deg,#1D1D1F 0%,#86868B 45%,#C7C7CC 55%,#1D1D1F 100%); --bar:rgba(242,242,247,.78); --veil:rgba(242,242,247,.55);
  --toast:rgba(255,255,255,.62); --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.05);
  --track:rgba(60,60,67,.12);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:#E7E7EB;color-scheme:only light}
html,body{margin:0;color:var(--label)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  font-size:17px;line-height:22px;letter-spacing:-.41px;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  min-height:100vh;min-height:100dvh;
}
button{font:inherit;color:inherit;letter-spacing:inherit}
button:focus-visible,.text:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:8px}

/* ---------- silver sheet background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(160deg,#F7F7F9 0%,#E4E4E8 45%,#CFCFD4 100%)}
.bg svg{position:absolute;inset:-6%;width:112%;height:112%}
.bg .l{transform-box:view-box;animation:drift 26s ease-in-out infinite alternate}
.bg .l2{animation-duration:31s;animation-delay:-8s}
.bg .l3{animation-duration:37s;animation-delay:-15s}
.bg .l4{animation-duration:43s;animation-delay:-21s}
.bg .l5{animation-duration:49s;animation-delay:-4s}
@keyframes drift{from{transform:translate3d(-14px,6px,0) rotate(-.35deg)}to{transform:translate3d(14px,-8px,0) rotate(.35deg)}}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 20% 0%,rgba(255,255,255,.7),transparent 60%),radial-gradient(70% 50% at 100% 100%,rgba(120,120,130,.18),transparent 70%)}
@media (prefers-reduced-motion:reduce){.bg .l{animation:none}}

/* ---------- header (iOS large-title nav bar) ---------- */
.spacer{height:clamp(20px,11vh,130px)}
header{
  position:sticky;top:0;z-index:5;
  padding:calc(10px + env(safe-area-inset-top)) 0 12px;
  transition:background-color .25s, box-shadow .25s;
}
header.scrolled{
  background:rgba(246,246,248,.55);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 .5px 0 var(--sep);
}
.hin{max-width:560px;margin:0 auto;padding:0 16px 0 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
h1{
  margin:0;font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
  font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.6px;background:var(--title);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{margin-top:2px;font-size:15px;line-height:20px;letter-spacing:-.24px;color:var(--label2);display:flex;gap:8px;flex-wrap:wrap}
.ringbtn{flex:none;width:44px;height:44px;margin-bottom:-2px;border:0;padding:0;background:none;cursor:pointer;touch-action:manipulation;border-radius:50%}
#ringSpin,#ring{display:block;width:44px;height:44px}
#ring circle{fill:none;stroke-width:7}
#ring .track{stroke:var(--track)}
#arc{stroke:url(#mg);stroke-linecap:round}

/* ---------- list ---------- */
.wrap{max-width:560px;margin:0 auto;padding:6px 16px calc(140px + env(safe-area-inset-bottom))}
.card{
  position:relative;isolation:isolate;list-style:none;margin:0;padding:0;
  border:1.5px solid transparent;border-radius:24px;overflow:hidden;
  background:linear-gradient(rgba(255,255,255,.62),rgba(255,255,255,.5)) padding-box,
             linear-gradient(135deg,#FFFFFF 0%,#B9B9BF 22%,#F2F2F4 45%,#9C9CA2 70%,#E9E9EC 100%) border-box;
  -webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(40,40,50,.08),0 30px 60px -24px rgba(50,50,65,.38),0 12px 24px -12px rgba(50,50,65,.18);
}
.card.shimmer::before{
  content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(105deg,transparent 30%,rgba(161,161,166,.22) 42%,rgba(255,255,255,.55) 50%,rgba(161,161,166,.22) 58%,transparent 70%);
  animation:sweep .95s cubic-bezier(.3,.7,.3,1) forwards;
}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

.row{position:relative;display:flex;align-items:flex-start;min-height:44px}
.row::after{content:"";position:absolute;left:52px;right:0;bottom:0;height:1px;background:rgba(60,60,67,.18);transform:scaleY(.5);transform-origin:bottom}
.row.leaving{opacity:0;transition:opacity .28s ease}
.row.entering{opacity:0}
.row.entered{opacity:1;transition:opacity .3s ease}

.check{flex:none;width:44px;height:44px;margin-left:8px;border:0;padding:0;background:none;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.check svg{width:22px;height:22px;overflow:visible;will-change:transform}
.check .o{fill:none;stroke:var(--label3);stroke-width:1.5;transition:stroke .2s}
.check .f{fill:url(#silver);stroke:rgba(0,0,0,.14);stroke-width:.6;transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.check .t{fill:none;stroke:#1D1D1F;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .22s cubic-bezier(.65,0,.35,1) .07s}
@media (hover:hover){
  .check:hover .o{stroke:var(--label2)}
  .row:not(.done) .check:hover .t{stroke:var(--label3);stroke-dashoffset:0;transition-delay:0s}
}
.done .check .o{stroke:#A1A1A6}
.done .check svg{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.22))}
.done .check .f{transform:scale(1)}
.done .check .t{stroke:#1D1D1F;stroke-dashoffset:0}

.text{flex:1;min-width:0;min-height:44px;padding:11px 8px 11px 4px;outline:none;word-break:break-word;white-space:pre-wrap;caret-color:var(--accent);transition:color .3s;cursor:text}
.text:focus-visible{outline:none}
.strike{background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0% 1.5px;transition:background-size .34s cubic-bezier(.65,0,.35,1)}
.struck .text{color:var(--label2)}
.struck .strike{background-size:100% 1.5px}

.del{flex:none;width:44px;height:44px;border:0;padding:0;background:none;color:var(--label3);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s,color .15s}
.del svg{width:14px;height:14px}
@media (hover:hover){ .row:hover .del{opacity:1} .del:hover{color:#FF3B30} }
.done .del{visibility:hidden}


.addrow{list-style:none}
.addbtn{
  width:100%;min-height:48px;display:flex;align-items:center;border:0;padding:0 16px 0 0;
  background:none;color:var(--accent2);font-weight:500;cursor:pointer;text-align:left;touch-action:manipulation;
  transition:background-color .15s;
}
.addbtn:active{background:rgba(120,120,128,.12)}
.addbtn .plus{width:44px;height:44px;margin-left:8px;display:grid;place-items:center;flex:none}
.addbtn .plus svg{width:22px;height:22px;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.2));will-change:transform}
.addbtn .lbl{padding-left:4px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:40;
  display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);
  padding:8px 8px 8px 18px;border-radius:999px;background:var(--toast);color:#1D1D1F;border:1px solid rgba(255,255,255,.85);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  font-size:15px;line-height:20px;letter-spacing:-.24px;font-weight:500;
  box-shadow:0 12px 34px -8px rgba(50,50,65,.35),inset 0 1px 0 rgba(255,255,255,.9);
  transform:translate(-50%,160%);opacity:0;
  transition:transform .5s cubic-bezier(.2,.9,.25,1.12),opacity .3s;
}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast .msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.toast .undo{border:0;border-radius:999px;padding:6px 14px;background:rgba(60,60,67,.08);color:#1D1D1F;font-weight:600;cursor:pointer}
.toast .undo:active{background:rgba(60,60,67,.16)}
.toast.nobtn{padding-right:18px}

/* ---------- finale ---------- */
.finale{
  position:fixed;inset:0;z-index:20;display:grid;place-items:center;pointer-events:none;
  background:var(--veil);-webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%);
  opacity:0;transition:opacity .45s ease;
}
.finale.show{opacity:1}
.finale .msg{text-align:center;padding:0 24px;will-change:transform}
.finale .big{
  font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
  font-size:clamp(44px,11vw,64px);line-height:1.05;font-weight:800;letter-spacing:-.03em;
  background:var(--chrome);background-size:200% 100%;animation:chrome 2.4s cubic-bezier(.4,0,.2,1) infinite;
  -webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em;
}
.finale .fsub{margin-top:10px;font-size:19px;line-height:24px;color:var(--label2);font-weight:500}

@keyframes chrome{from{background-position:100% 0}to{background-position:-100% 0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

@media (max-width:400px){ .hin{padding-left:16px} h1{font-size:32px} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FBFBFD"/><stop offset=".5" stop-color="#D2D2D7"/><stop offset="1" stop-color="#A1A1A6"/>
  </linearGradient>
</defs></svg>
<div class="bg" aria-hidden="true">
<svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="s1" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#FBFBFC"/><stop offset=".5" stop-color="#E2E2E6"/><stop offset="1" stop-color="#C4C4CA"/></linearGradient>
    <linearGradient id="s2" x1=".1" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="#F6F6F8"/><stop offset=".5" stop-color="#D6D6DB"/><stop offset="1" stop-color="#B3B3BA"/></linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#FDFDFE"/><stop offset=".5" stop-color="#E4E4E8"/><stop offset="1" stop-color="#BDBDC4"/></linearGradient>
    <linearGradient id="s4" x1=".2" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="#F2F2F5"/><stop offset=".5" stop-color="#CDCDD3"/><stop offset="1" stop-color="#A5A5AD"/></linearGradient>
    <linearGradient id="s5" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#FAFAFB"/><stop offset=".5" stop-color="#DCDCE0"/><stop offset="1" stop-color="#B8B8BF"/></linearGradient>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="-8" stdDeviation="16" flood-color="#3C3C46" flood-opacity=".22"/></filter>
  </defs>
  <g class="l l1" filter="url(#sh)"><path fill="url(#s1)" d="M-80 300C200 210 430 40 760 80S1260 120 1540 -20V980H-80Z"/><path fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="1.6" d="M-80 300C200 210 430 40 760 80S1260 120 1540 -20"/></g>
  <g class="l l2" filter="url(#sh)"><path fill="url(#s2)" d="M-80 470C240 400 470 230 820 250S1300 250 1540 130V980H-80Z"/><path fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="1.6" d="M-80 470C240 400 470 230 820 250S1300 250 1540 130"/></g>
  <g class="l l3" filter="url(#sh)"><path fill="url(#s3)" d="M-80 610C280 580 540 400 900 420S1330 420 1540 320V980H-80Z"/><path fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="1.6" d="M-80 610C280 580 540 400 900 420S1330 420 1540 320"/></g>
  <g class="l l4" filter="url(#sh)"><path fill="url(#s4)" d="M-80 740C320 730 600 560 980 590S1360 600 1540 510V980H-80Z"/><path fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="1.6" d="M-80 740C320 730 600 560 980 590S1360 600 1540 510"/></g>
  <g class="l l5" filter="url(#sh)"><path fill="url(#s5)" d="M-80 860C360 870 660 720 1040 750S1390 770 1540 700V980H-80Z"/><path fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="1.6" d="M-80 860C360 870 660 720 1040 750S1390 770 1540 700"/></g>
</svg>
</div>

<div class="spacer"></div>
<header id="hdr">
  <div class="hin">
    <div>
      <h1>Today</h1>
      <div class="sub"><span id="date"></span></div>
    </div>
    <button class="ringbtn" id="ringBtn" aria-label="Progress">
      <div id="ringSpin">
        <svg id="ring" viewBox="0 0 44 44" aria-hidden="true">
          <defs>
            <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#1D1D1F"/><stop offset=".55" stop-color="#6E6E73"/><stop offset="1" stop-color="#AEAEB2"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="22" cy="22" r="17"/>
          <circle id="arc" cx="22" cy="22" r="17" transform="rotate(-90 22 22)"/>
        </svg>
      </div>
    </button>
  </div>
</header>

<main class="wrap">
  <ul class="card" id="list">
    <li class="addrow" id="addRow">
      <button class="addbtn" id="addBtn">
        <span class="plus"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="url(#silver)" stroke="rgba(0,0,0,.14)" stroke-width=".6"/><path d="M12 7v10M7 12h10" stroke="#1D1D1F" stroke-width="2" stroke-linecap="round"/></svg></span>
        <span class="lbl">New Reminder</span>
      </button>
    </li>
  </ul>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="msg" id="toastMsg"></span>
  <button class="undo" id="undoBtn">Undo</button>
</div>

<div class="finale" id="finale" aria-hidden="true">
  <div class="msg" id="finaleMsg"><div class="big">All done.</div><div class="fsub" id="finaleSub"></div></div>
</div>

<canvas id="fx"></canvas>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= store ================= */
const KEY = 'today.v1';
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const dayDiff = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 864e5);
const uid = () => Math.random().toString(36).slice(2, 10);

let state = { tasks: [], day: todayStr(), done: 0, sound: true };
try {
  const s = JSON.parse(localStorage.getItem(KEY));
  if (s && Array.isArray(s.tasks)) state = Object.assign(state, s);
} catch (e) {}
state.tasks = state.tasks.filter(t => t && typeof t.text === 'string' && t.text.trim());

function rollDay() { const t = todayStr(); if (state.day !== t) { state.day = t; state.done = 0; save(); } }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ ...state, tasks: state.tasks.filter(t => t.text.trim()) })); } catch (e) {}
}
const liveTasks = () => state.tasks.filter(t => t.text.trim());
rollDay();

/* ================= spring (Apple-style: response / dampingFraction) ================= */
const springs = new WeakMap();
function spring(el, key, o) {
  let map = springs.get(el); if (!map) springs.set(el, map = {});
  const prev = map[key]; if (prev) cancelAnimationFrame(prev.id);
  let response = o.response ?? .35, damping = o.damping ?? .7;
  if (reduce) { response = Math.min(response, .12); damping = 1; }
  const to = o.to, eps = o.eps ?? .001;
  let x = o.from ?? (prev ? prev.x : to), v = o.v ?? (prev ? prev.v : 0);
  const k = (2 * Math.PI / response) ** 2, c = 4 * Math.PI * damping / response;
  const h = map[key] = { id: 0, x, v };
  let last = performance.now();
  const step = now => {
    const dt = Math.min((now - last) / 1000, 1 / 20); last = now;
    const n = 8, s = dt / n;
    for (let i = 0; i < n; i++) { const a = -k * (x - to) - c * v; v += a * s; x += v * s; }
    h.x = x; h.v = v;
    if (Math.abs(x - to) < eps && Math.abs(v) < eps * 20) { h.x = to; h.v = 0; o.set(to); o.done && o.done(); return; }
    o.set(x); h.id = requestAnimationFrame(step);
  };
  h.id = requestAnimationFrame(step);
  return h;
}
const scaleSet = el => x => { el.style.transform = `scale(${x})`; };

/* ================= audio (synthesised, no files) ================= */
let ac, master, fxIn, noiseBuf;
const freqLog = [];
function audio() {
  if (!state.sound) return null;
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    ac = new AC();
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    master = ac.createGain(); master.gain.value = .9; master.connect(comp); comp.connect(ac.destination);
    // airy echo tail
    const d = ac.createDelay(1), fb = ac.createGain(), lp = ac.createBiquadFilter(), wet = ac.createGain();
    d.delayTime.value = .13; fb.gain.value = .28; lp.type = 'lowpass'; lp.frequency.value = 3400; wet.gain.value = .2;
    fxIn = ac.createGain();
    fxIn.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(wet); wet.connect(master);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function note(f, delay = 0, { gain = .18, decay = .55 } = {}) {
  const a = audio(); if (!a) return;
  freqLog.push(Math.round(f));
  const t = a.currentTime + .005 + delay;
  const out = a.createGain(); out.connect(master); out.connect(fxIn);
  for (const [m, amp, dk] of [[1, 1, decay], [2, .3, decay * .6], [3, .08, decay * .35]]) {
    for (const [det, pan] of [[-4, -.3], [4, .3]]) {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = f * m; o.detune.value = det;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(gain * amp * .5, t + .004);
      g.gain.exponentialRampToValueAtTime(.0001, t + dk);
      o.connect(g);
      if (a.createStereoPanner) { const p = a.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(out); }
      else g.connect(out);
      o.start(t); o.stop(t + dk + .05);
    }
  }
}
function tickSound() {
  const a = audio(); if (!a) return;
  if (!noiseBuf) {
    const n = Math.floor(a.sampleRate * .014);
    noiseBuf = a.createBuffer(1, n, a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 4);
  }
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 1.1; g.gain.value = .3;
  s.connect(f); f.connect(g); g.connect(master); s.start();
}
// major pentatonic from G5 — every combo step climbs
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28];
const hz = i => 783.99 * Math.pow(2, SCALE[Math.min(i, SCALE.length - 1)] / 12);
const chime = step => note(hz(step), 0, { gain: .2, decay: .6 });
const sparkle = step => [1, 2, 3].forEach((d, i) => note(hz(step + d + 1), .09 + i * .065, { gain: .09, decay: .4 }));
function chord() {
  [392, 493.88, 587.33, 739.99, 783.99].forEach((f, i) => note(f, i * .075, { gain: .13, decay: 2.2 }));
  note(1567.98, .42, { gain: .09, decay: 1.8 });
}
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

/* ================= particles ================= */
const cv = $('#fx'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize(); addEventListener('resize', resize);
const COLORS = ['#1D1D1F', '#6E6E73', '#A1A1A6', '#C7C7CC', '#E8E8ED', '#86868B', '#FFFFFF', '#D1D1D6'];
const pick = () => COLORS[Math.random() * COLORS.length | 0];
let parts = [], ripples = [], raf = 0, lastT = 0;
function pill(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  ctx.fill();
}
function frame(t) {
  const dt = Math.min((t - lastT) / 1000, 1 / 30); lastT = t;
  ctx.clearRect(0, 0, W, H);
  parts = parts.filter(p => {
    p.life += dt; if (p.life > p.max) return false;
    const drag = Math.exp(-p.drag * dt);
    p.vx *= drag; p.vy = p.vy * drag + p.g * dt;
    p.x += p.vx * dt + (p.sway ? Math.sin(p.life * p.sway) * 30 * dt : 0); p.y += p.vy * dt; p.r += p.vr * dt;
    const k = p.life / p.max;
    ctx.globalAlpha = k < .7 ? 1 : 1 - (k - .7) / .3;
    ctx.fillStyle = p.c;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    if (p.shape === 0) { ctx.beginPath(); ctx.arc(0, 0, p.s, 0, 7); ctx.fill(); }
    else if (p.shape === 1) pill(-p.s * 1.7, -p.s * .55, p.s * 3.4, p.s * 1.1, p.s * .55);
    else { const f = Math.cos(p.life * p.flip); if (p.foil) ctx.fillStyle = `hsl(240,3%,${30 + Math.abs(f) * 62}%)`; ctx.scale(1, f); pill(-p.s * .55, -p.s, p.s * 1.1, p.s * 2, 1.5); }
    ctx.restore();
    return true;
  });
  ripples = ripples.filter(r => {
    r.life += dt; if (r.life > r.max) return false;
    const k = r.life / r.max, e = 1 - Math.pow(1 - k, 3);
    ctx.globalAlpha = (1 - k) * .55; ctx.strokeStyle = r.c; ctx.lineWidth = 2.5 * (1 - k) + .5;
    ctx.beginPath(); ctx.arc(r.x, r.y, 11 + e * r.R, 0, 7); ctx.stroke();
    return true;
  });
  ctx.globalAlpha = 1;
  if (parts.length || ripples.length) raf = requestAnimationFrame(frame);
  else { raf = 0; ctx.clearRect(0, 0, W, H); }
}
const kick = () => { if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(frame); } };
function burst(x, y, n, power = 1) {
  if (reduce) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (240 + Math.random() * 420) * power;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 140 * power, g: 950, drag: 3.4,
      s: 1.8 + Math.random() * 2.6, shape: Math.random() < .5 ? 1 : 0, r: a, vr: (Math.random() - .5) * 10,
      c: pick(), life: 0, max: .65 + Math.random() * .5 });
  }
  ripples.push({ x, y, life: 0, max: .55, R: 30 * power, c: '#A1A1A6' });
  kick();
}
function confetti() {
  if (reduce) return;
  for (let i = 0; i < 150; i++) {       // two cannons from the bottom corners
    const left = i % 2 === 0, a = (left ? -1 : -2.14) + (Math.random() - .5) * .5, sp = 900 + Math.random() * 900;
    parts.push({ x: left ? -10 : W + 10, y: H + 10, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 700, drag: 2.1,
      s: 4 + Math.random() * 3, shape: 2, r: Math.random() * 6, vr: (Math.random() - .5) * 12, flip: 6 + Math.random() * 12,
      sway: 3 + Math.random() * 3, c: pick(), foil: Math.random() < .9, life: 0, max: 2.6 + Math.random() * 1.2 });
  }
  for (let i = 0; i < 90; i++) {        // gentle rain from the top edge
    parts.push({ x: Math.random() * W, y: -20 - Math.random() * 200, vx: (Math.random() - .5) * 60, vy: 80 + Math.random() * 120,
      g: 160, drag: .6, s: 3.5 + Math.random() * 3, shape: 2, r: Math.random() * 6, vr: (Math.random() - .5) * 8,
      flip: 5 + Math.random() * 10, sway: 2 + Math.random() * 3, c: pick(), foil: Math.random() < .9, life: 0, max: 3 + Math.random() * 1.2 });
  }
  kick();
}

/* ================= ring ================= */
const ringBtn = $('#ringBtn'), ringSpin = $('#ringSpin'), ring = $('#ring'), arc = $('#arc');
const CIRC = 2 * Math.PI * 17;
arc.style.strokeDasharray = CIRC;
function setRing(v) {
  v = Math.max(0, Math.min(1, v));
  arc.style.strokeDashoffset = CIRC * (1 - v);
  arc.style.opacity = v > .004 ? 1 : 0;
  const glow = v > .75 ? (v - .75) / .25 : 0;
  ring.style.filter = glow ? `drop-shadow(0 0 ${2 + glow * 7}px rgba(255,255,255,${.5 + glow * .5})) drop-shadow(0 2px ${2 + glow * 4}px rgba(40,40,50,${.12 + glow * .2}))` : 'none';
}
function progress() { const rem = liveTasks().length, tot = state.done + rem; return tot ? state.done / tot : 0; }
const updateRing = () => spring(ring, 'p', { to: progress(), response: .7, damping: .78, eps: .0005, set: setRing });
setRing(0);

/* ================= header ================= */
const hdr = $('#hdr');
const onScroll = () => hdr.classList.toggle('scrolled', window.scrollY > 4);
addEventListener('scroll', onScroll, { passive: true }); onScroll();
function renderHeader() {
  $('#date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}

/* ================= toast ================= */
const toast = $('#toast'), toastMsg = $('#toastMsg'), undoBtn = $('#undoBtn');
let toastT, undo = null;
function showToast(msg, withUndo) {
  toastMsg.textContent = msg; undoBtn.hidden = !withUndo; toast.classList.toggle('nobtn', !withUndo);
  toast.classList.add('show'); clearTimeout(toastT);
  toastT = setTimeout(() => { toast.classList.remove('show'); undo = null; }, withUndo ? 4000 : 1800);
}

/* ================= list ================= */
const list = $('#list'), addRow = $('#addRow'), addBtn = $('#addBtn');
let CE = 'true';
try { const d = document.createElement('div'); d.contentEditable = 'plaintext-only'; if (d.contentEditable === 'plaintext-only') CE = 'plaintext-only'; } catch (e) {}

const rows = () => [...list.querySelectorAll('.row')].filter(li => !li._gone);
function focusEnd(el) {
  el.focus();
  const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

function rowEl(task) {
  const li = document.createElement('li');
  li.className = 'row'; li._task = task;
  li.innerHTML =
    `<button class="check" aria-label="Complete"><svg viewBox="0 0 24 24" aria-hidden="true">` +
    `<circle class="o" cx="12" cy="12" r="10.75"/><circle class="f" cx="12" cy="12" r="11.5"/>` +
    `<path class="t" pathLength="1" d="M7.3 12.4l3.2 3.2 6.2-6.5"/></svg></button>` +
    `<div class="text" spellcheck="false" enterkeyhint="done" role="textbox" aria-label="Reminder"></div>` +
    `<button class="del" aria-label="Delete"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>`;
  const tx = li.querySelector('.text');
  tx.contentEditable = CE; tx.textContent = task.text;
  wire(li);
  return li;
}

function wire(li) {
  const btn = li.querySelector('.check'), svg = btn.firstElementChild, tx = li.querySelector('.text');
  const canPress = () => !li.classList.contains('done') && !li._gone && tx.textContent.trim();
  btn.addEventListener('pointerdown', () => {
    if (!canPress()) return;
    audio(); tickSound(); buzz(8);
    spring(svg, 's', { to: .84, response: .2, damping: .8, set: scaleSet(svg) });
  });
  const release = () => { if (!li.classList.contains('done')) spring(svg, 's', { to: 1, response: .3, damping: .6, set: scaleSet(svg) }); };
  btn.addEventListener('pointerleave', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('click', () => complete(li));

  tx.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      if (tx.textContent.trim()) { commit(li); newRow(li); } else tx.blur();
    } else if (e.key === 'Escape') {
      tx.blur();
    } else if (e.key === 'Backspace' && !tx.textContent) {
      e.preventDefault();
      const prev = li.previousElementSibling;
      removeRow(li);
      if (prev && prev._task && !prev._gone) focusEnd(prev.querySelector('.text'));
    }
  });
  tx.addEventListener('blur', () => {
    if (li.classList.contains('done') || li._gone) return;
    if (!tx.textContent.trim()) removeRow(li); else commit(li);
  });
  tx.addEventListener('paste', e => {
    e.preventDefault();
    const t = (e.clipboardData.getData('text/plain') || '').replace(/\s+/g, ' ');
    document.execCommand('insertText', false, t);
  });
  li.querySelector('.del').addEventListener('click', () => removeRow(li));
}

function commit(li) {
  li._task.text = li.querySelector('.text').textContent.trim();
  save(); updateRing();
}

function expand(li) {
  li.style.height = '0px'; li.style.overflow = 'hidden'; li.classList.add('entering');
  const target = li.scrollHeight;
  requestAnimationFrame(() => { li.classList.remove('entering'); li.classList.add('entered'); });
  spring(li, 'h', { from: 0, to: target, response: .42, damping: .82, eps: .5,
    set: x => { li.style.height = Math.max(0, x) + 'px'; },
    done: () => { li.style.height = ''; li.style.overflow = ''; li.classList.remove('entered'); } });
}
function collapse(li, done) {
  const h = li.offsetHeight;
  li.style.height = h + 'px'; li.style.overflow = 'hidden'; li.classList.add('leaving');
  spring(li, 'h', { from: h, to: 0, response: .4, damping: .92, eps: .5,
    set: x => { li.style.height = Math.max(0, x) + 'px'; }, done });
}

function newRow(after) {
  const task = { id: uid(), text: '' };
  const i = after ? state.tasks.indexOf(after._task) : -1;
  if (i >= 0) state.tasks.splice(i + 1, 0, task); else state.tasks.push(task);
  const li = rowEl(task);
  list.insertBefore(li, after && after.nextSibling ? after.nextSibling : addRow);
  expand(li);
  li.querySelector('.text').focus();
  return li;
}

function removeRow(li) {
  if (li._gone) return;
  li._gone = true;
  const i = state.tasks.indexOf(li._task); if (i >= 0) state.tasks.splice(i, 1);
  save(); updateRing();
  collapse(li, () => li.remove());
}

/* ================= the moment ================= */
let combo = 0, lastDone = -1e9;
function complete(li) {
  const tx = li.querySelector('.text'), text = tx.textContent.trim();
  if (li.classList.contains('done') || li._gone || !text) return;
  audio();
  const task = li._task; task.text = text;
  li.classList.add('done'); li._gone = true;
  tx.contentEditable = 'false';
  if (document.activeElement === tx) tx.blur();
  tx.textContent = ''; const sp = document.createElement('span'); sp.className = 'strike'; sp.textContent = text; tx.appendChild(sp);

  const idx = state.tasks.indexOf(task);
  if (idx >= 0) state.tasks.splice(idx, 1);
  state.done++; save(); renderHeader();

  const now = performance.now();
  combo = now - lastDone < 5000 ? combo + 1 : 0; lastDone = now;
  const step = Math.min(combo, 9);
  const finish = liveTasks().length === 0;
  const bloom = !finish && Math.random() < 1 / 7;

  const btn = li.querySelector('.check'), svg = btn.firstElementChild;
  spring(svg, 's', { to: 1, v: 4.2, response: .38, damping: .5, set: scaleSet(svg) });
  chime(step);
  if (bloom) sparkle(step);

  const r = btn.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  setTimeout(() => burst(cx, cy, bloom ? 56 : 14 + Math.min(combo, 4) * 3, bloom ? 1.5 : 1 + Math.min(combo, 4) * .1), 40);
  setTimeout(() => buzz(bloom ? [12, 40, 18, 40, 30] : [10, 40, 18]), 60);
  setTimeout(() => li.classList.add('struck'), 120);
  setTimeout(updateRing, 180);
  if (bloom) { list.classList.remove('shimmer'); void list.offsetWidth; list.classList.add('shimmer'); setTimeout(() => list.classList.remove('shimmer'), 1000); }
  setTimeout(() => collapse(li, () => { li.remove(); }), 450);

  undo = { task, idx, li };
  showToast(combo >= 2 ? `${combo + 1} in a row` : 'Completed', true);
  if (finish) setTimeout(finale, 650);
}

undoBtn.addEventListener('click', () => {
  if (!undo) return;
  const { task, idx, li } = undo; undo = null;
  if (li.isConnected) li.remove();
  const i = Math.max(0, Math.min(idx, state.tasks.length));
  state.tasks.splice(i, 0, task);
  state.done = Math.max(0, state.done - 1); combo = 0; lastDone = -1e9;
  save();
  const next = state.tasks[i + 1];
  const nextLi = next && rows().find(r => r._task === next);
  const nl = rowEl(task);
  list.insertBefore(nl, nextLi || addRow);
  expand(nl); updateRing();
  toast.classList.remove('show');
});

/* ================= finale ================= */
const fin = $('#finale'), finMsg = $('#finaleMsg');
let finT;
function finale() {
  chord(); buzz([20, 60, 20, 60, 45]); confetti();
  spring(ringSpin, 'r', { from: 0, to: 360, response: 1.1, damping: .8, eps: .3, set: x => { ringSpin.style.transform = `rotate(${x}deg)`; } });
  spring(ringBtn, 'pop', { from: 1, to: 1, v: 7, response: .5, damping: .45, set: scaleSet(ringBtn) });
  const rr = ringBtn.getBoundingClientRect();
  setTimeout(() => burst(rr.left + 22, rr.top + 22, 36, 1.3), 120);
  const n = state.done;
  $('#finaleSub').textContent = `You finished ${n} ${n === 1 ? 'thing' : 'things'} today.`;
  fin.classList.add('show');
  spring(finMsg, 's', { from: .72, to: 1, v: 0, response: .55, damping: .62, set: scaleSet(finMsg) });
  clearTimeout(finT);
  finT = setTimeout(() => fin.classList.remove('show'), 2600);
}

/* ================= add button ================= */
const plusSvg = addBtn.querySelector('svg');
addBtn.addEventListener('pointerdown', () => {
  audio(); tickSound();
  spring(plusSvg, 's', { to: .82, response: .2, damping: .8, set: scaleSet(plusSvg) });
});
const plusRelease = () => spring(plusSvg, 's', { to: 1, v: 3, response: .35, damping: .5, set: scaleSet(plusSvg) });
addBtn.addEventListener('pointerup', plusRelease);
addBtn.addEventListener('pointerleave', plusRelease);
addBtn.addEventListener('click', () => {
  // an empty draft that is still open: just refocus it instead of stacking blanks
  const draft = rows().find(r => !r._task.text && !r.querySelector('.text').textContent.trim());
  if (draft) { draft.querySelector('.text').focus(); return; }
  const all = rows(); newRow(all[all.length - 1] || null);
});

/* ================= sound toggle & shortcuts ================= */
function toggleSound() {
  state.sound = !state.sound; save();
  if (state.sound) { audio(); note(hz(2), 0, { gain: .12, decay: .3 }); }
  showToast(state.sound ? 'Sound On' : 'Sound Off', false);
}
let lpT, longPressed = false;
ringBtn.addEventListener('pointerdown', () => { longPressed = false; lpT = setTimeout(() => { longPressed = true; buzz(15); toggleSound(); }, 550); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => ringBtn.addEventListener(ev, () => clearTimeout(lpT)));
ringBtn.addEventListener('click', () => {
  if (longPressed) return;
  const rem = liveTasks().length, tot = state.done + rem;
  spring(ringBtn, 'pop', { from: 1, to: 1, v: 3, response: .4, damping: .5, set: scaleSet(ringBtn) });
  showToast(tot ? `${state.done} of ${tot} done today` : 'Add a reminder to start', false);
});
addEventListener('keydown', e => {
  const editing = document.activeElement && document.activeElement.isContentEditable;
  if (editing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'm' || e.key === 'M') toggleSound();
  else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); addBtn.click(); }
});

/* ================= boot ================= */
for (const t of state.tasks) list.insertBefore(rowEl(t), addRow);
renderHeader();
requestAnimationFrame(() => spring(ring, 'p', { from: 0, to: progress(), response: .9, damping: .8, eps: .0005, set: setRing }));
setInterval(() => { const d = state.day; rollDay(); if (d !== state.day) { renderHeader(); updateRing(); } }, 60000);

window.__today = { state, freqLog };
})();
</script>
</body>
